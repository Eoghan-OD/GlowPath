<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlowPath | Add Workout</title>
  <link rel="stylesheet" href="style-glowpath.css" />
</head>
<body>
  <header class="glowpath-header">
    <img src="assets/logo.png" alt="GlowPath Logo" class="glowpath-logo" />
    <h1>GlowPath Fitness Tracker</h1>
    <p>Simple. Lightweight. Effective.</p>
  </header>

  <nav class="glowpath-nav">
    <a href="home-glowpath.html">Home</a>
    <a href="index-glowpath.html" class="active">Add Workout</a>
    <a href="team-glowpath.html">Team</a>
  </nav>

  <main class="glowpath-main">
    <section class="glowpath-section" id="manual-entry">
      <h2>Manual Workout Entry</h2>
      <form id="glowpath-form">
        <label for="activity">Activity Type:</label>
        <select id="activity" name="activity" required>
          <option value="">Select activity...</option>
          <option>Running</option>
          <option>Walking</option>
          <option>Cycling</option>
          <option>Gym Workout</option>
          <option>Yoga</option>
        </select>

        <label for="duration">Duration (minutes):</label>
        <input type="number" id="duration" name="duration" placeholder="e.g., 45" required />

        <label for="calories">Calories Burned:</label>
        <input type="number" id="calories" name="calories" placeholder="e.g., 300" required />

        <label for="steps">Steps Taken (optional):</label>
        <input type="number" id="steps" name="steps" placeholder="e.g., 5000" />

        <button type="submit">Save Workout</button>
      </form>
      <p id="glowpath-message"></p>
    </section>

    <section class="glowpath-section" id="csv-upload">
      <h2>Upload Workout Data (CSV)</h2>
      <p>Upload a dataset (30–50 rows) based on the FitBit Fitness Tracker data.</p>
      <input type="file" id="csvFileInput" accept=".csv" />
      <button id="uploadBtn">Preview CSV</button>
    </section>

    <section class="glowpath-section" id="data-table">
      <h2>Recorded Workouts</h2>
      <table id="workoutTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Activity</th>
            <th>Duration (min)</th>
            <th>Calories</th>
            <th>Steps</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <footer class="glowpath-footer">
    <p>© 2025 GlowPath Team | MTU Cork</p>
  </footer>

  <script src="script-glowpath.js"></script>
</body>
</html>
